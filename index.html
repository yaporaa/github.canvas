
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aura.proxy | Proxy Finder</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #090910;
    color: #f4f4fa;
    font-family: Arial, sans-serif;
    min-height: 100vh;
}

header {
    height: 75px;
    padding: 0 7%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #222230;
    background: #0c0c15;
}

.logo {
    font-size: 23px;
    font-weight: 800;
    letter-spacing: -1px;
}

.logo span {
    color: #a879ff;
}

.status {
    color: #aaa5bc;
    font-size: 12px;
}

.status i {
    display: inline-block;
    width: 7px;
    height: 7px;
    background: #8d65ff;
    border-radius: 50%;
    margin-right: 7px;
}

main {
    max-width: 1050px;
    margin: auto;
    padding: 75px 25px;
}

.hero {
    text-align: center;
    margin-bottom: 40px;
}

.tag {
    display: inline-block;
    padding: 7px 13px;
    border: 1px solid #453267;
    background: #1a1229;
    color: #b99aff;
    border-radius: 30px;
    font-size: 11px;
    margin-bottom: 20px;
}

h1 {
    font-size: clamp(38px, 7vw, 65px);
    letter-spacing: -3px;
    margin-bottom: 15px;
}

h1 span {
    color: #a879ff;
}

.subtitle {
    color: #92909f;
    font-size: 14px;
    line-height: 1.7;
}

.search {
    max-width: 620px;
    margin: 30px auto 45px;
    position: relative;
}

.search input {
    width: 100%;
    background: #12121e;
    border: 1px solid #302b42;
    outline: none;
    border-radius: 12px;
    padding: 17px 20px;
    color: white;
    font-size: 14px;
    transition: .2s;
}

.search input:focus {
    border-color: #9563ff;
    box-shadow: 0 0 20px #8751ff18;
}

.section-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
}

.section-title h2 {
    font-size: 17px;
}

.count {
    color: #a879ff;
    font-size: 12px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

.site {
    background: #11111c;
    border: 1px solid #262537;
    border-radius: 13px;
    padding: 21px;
    transition: .2s;
}

.site:hover {
    border-color: #8959e9;
    transform: translateY(-3px);
    background: #151421;
}

.site-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 17px;
}

.site h3 {
    font-size: 15px;
    font-weight: 650;
}

.number {
    color: #817c93;
    font-size: 11px;
}

.site p {
    font-size: 11px;
    color: #777487;
    margin-bottom: 19px;
    overflow-wrap: anywhere;
}

.launch {
    width: 100%;
    background: #8656e9;
    border: none;
    border-radius: 8px;
    color: white;
    padding: 11px;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
    transition: .2s;
}

.launch:hover {
    background: #a174ff;
}

.empty {
    display: none;
    color: #777487;
    text-align: center;
    padding: 35px;
}

footer {
    border-top: 1px solid #222230;
    padding: 25px;
    text-align: center;
    color: #625f70;
    font-size: 11px;
}

@media(max-width: 600px) {
    header { padding: 0 5%; }
    main { padding: 55px 17px; }
    .grid { grid-template-columns: 1fr; }
    h1 { letter-spacing: -2px; }
}
</style>
</head>

<body>

<header>
    <div class="logo">Aura<span>.proxy</span></div>
    <div class="status"><i></i> Proxy Directory</div>
</header>

<main>

    <section class="hero">
        <div class="tag">AURA PROXY FINDER</div>
        <h1>Browse beyond <span>limits.</span></h1>
        <p class="subtitle">
            Find your preferred browsing destination.<br>
            Choose a proxy and launch it in a new blank tab.
        </p>
    </section>

    <div class="search">
        <input
            type="text"
            id="search"
            placeholder="Search proxy destinations..."
            autocomplete="off"
        >
    </div>

    <div class="section-title">
        <h2>Available destinations</h2>
        <span class="count" id="count">8 DESTINATIONS</span>
    </div>

    <div class="grid" id="grid"></div>

    <div class="empty" id="empty">
        No matching destinations found.
    </div>

</main>

<footer>
    AURA.PROXY &copy; 2026 · Proxy Finder
</footer>

<script>
const sites = [
    {
        name: "Brave Marble",
        url: "https://s3.us-east-2.amazonaws.com/bravemarble93/index.html"
    },
    {
        name: "Rough Pebble",
        url: "https://s3.us-east-2.amazonaws.com/roughpebble80/index.html"
    },
    {
        name: "Cozy Pillow",
        url: "https://s3.us-east-2.amazonaws.com/cozypillow45/index.html"
    },
    {
        name: "Lucky Pebble",
        url: "https://s3.us-east-2.amazonaws.com/luckypebble87/index.html"
    },
    {
        name: "Fancy Maple",
        url: "https://s3.us-east-2.amazonaws.com/fancymaple62/index.html"
    },
    {
        name: "Bold Muffin",
        url: "https://s3.us-east-2.amazonaws.com/boldmuffin94/index.html"
    },
    {
        name: "Cozy Maple",
        url: "https://s3.us-east-2.amazonaws.com/cozymaple26/index.html"
    },
    {
        name: "Dusty Lemon",
        url: "https://s3.us-east-2.amazonaws.com/dustylemon10/index.htm"
    }
];

const grid = document.getElementById("grid");
const search = document.getElementById("search");
const count = document.getElementById("count");
const empty = document.getElementById("empty");

function renderSites(filter = "") {
    grid.innerHTML = "";

    const filtered = sites.filter(site =>
        site.name.toLowerCase().includes(filter.toLowerCase()) ||
        site.url.toLowerCase().includes(filter.toLowerCase())
    );

    count.textContent = filtered.length + " DESTINATIONS";
    empty.style.display = filtered.length ? "none" : "block";

    filtered.forEach((site) => {
        const index = sites.indexOf(site);

        const card = document.createElement("div");
        card.className = "site";

        const top = document.createElement("div");
        top.className = "site-top";

        const heading = document.createElement("h3");
        heading.textContent = site.name;

        const number = document.createElement("span");
        number.className = "number";
        number.textContent = "#" + String(index + 1).padStart(2, "0");

        top.append(heading, number);

        const address = document.createElement("p");
        address.textContent = site.url;

        const button = document.createElement("button");
        button.className = "launch";
        button.textContent = "Launch Proxy ↗";
        button.addEventListener("click", () => launchSite(site.url));

        card.append(top, address, button);
        grid.appendChild(card);
    });
}

function launchSite(url) {
    const tab = window.open("about:blank", "_blank");

    if (!tab) {
        alert("Your browser blocked the new tab. Allow popups and try again.");
        return;
    }

    tab.document.open();
    tab.document.write(`
        <!DOCTYPE html>
        <html>
        <head>
            <title>Aura.proxy</title>
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <style>
                * { margin: 0; padding: 0; }
                html, body, iframe {
                    width: 100%;
                    height: 100%;
                    border: 0;
                    background: #090910;
                }
            </style>
        </head>
        <body>
            <iframe
                src="${url}"
                allow="fullscreen"
                referrerpolicy="no-referrer"
                title="Proxy destination">
            </iframe>
        </body>
        </html>
    `);
    tab.document.close();
}

search.addEventListener("input", () => {
    renderSites(search.value);
});

renderSites();
</script>

</body>
</html>
